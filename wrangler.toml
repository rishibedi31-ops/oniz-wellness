name = "onizwellness"
main = "worker.js"
compatibility_date = "2026-09-07"

# /api/*  → Worker (Supabase)
# everything else → the website in public/
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
CLINIC_ID = "clinic-oniz-health"
TZ = "America/Toronto"
