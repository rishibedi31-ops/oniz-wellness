<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a visit · Oniz Health and Wellness</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div data-header></div>
  <main class="wrap section" style="max-width:44rem">
    <p class="kicker">Book</p>
    <h1>Pick a visit</h1>
    <p class="lead">First name, last name, email, and phone — then a service and a time that is actually open.</p>

    <form class="form" id="book-form" style="margin-top:2rem">
      <div class="row-2">
        <label>First name<input name="firstName" required autocomplete="given-name" /></label>
        <label>Last name<input name="lastName" required autocomplete="family-name" /></label>
      </div>
      <div class="row-2">
        <label>Email<input name="email" type="email" required autocomplete="email" /></label>
        <label>Phone<input name="phone" required autocomplete="tel" /></label>
      </div>
      <div>
        <p class="kicker">Service</p>
        <div class="chip-row" id="services" style="margin-top:0.6rem"></div>
      </div>
      <div>
        <p class="kicker">Day</p>
        <div class="chip-row" id="days" style="margin-top:0.6rem"></div>
      </div>
      <div>
        <p class="kicker">Time</p>
        <div class="chip-row" id="slots" style="margin-top:0.6rem"><span class="muted">Choose a service and day.</span></div>
      </div>
      <button class="btn btn-primary" type="submit">Book this visit</button>
    </form>
    <div id="done" hidden class="notice" style="margin-top:1.5rem"></div>
  </main>
  <div data-footer></div>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/book.js"></script>
</body>
</html>
