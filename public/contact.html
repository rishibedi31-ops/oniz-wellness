<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · Oniz Health and Wellness</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div data-header></div>
  <main class="wrap section split">
    <section>
      <p class="kicker">Write to us</p>
      <h1>The desk</h1>
      <p class="lead">Questions about visits, labs, or insurance. We reply by email.</p>
      <form class="form" id="contact-form" style="margin-top:1.5rem">
        <label>Name<input name="name" required /></label>
        <div class="row-2">
          <label>Email<input name="email" type="email" required /></label>
          <label>Phone<input name="phone" /></label>
        </div>
        <label>Topic
          <select name="topic">
            <option value="general">General</option>
            <option value="booking">Booking</option>
            <option value="insurance">Insurance / claims</option>
            <option value="labs">Labs</option>
          </select>
        </label>
        <label>Message<textarea name="message" required minlength="8"></textarea></label>
        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
    </section>
    <aside>
      <div class="notice">
        <p class="kicker">Hours</p>
        <ul class="hours" id="hours-list"></ul>
        <p class="muted" style="margin-top:1rem">84 Queen Street East, Brampton, ON L6V 1A1</p>
      </div>
      <form class="form" id="news-form" style="margin-top:1.5rem">
        <p class="kicker">Clinic notes</p>
        <label>Email<input name="email" type="email" required placeholder="you@email.com" /></label>
        <button class="btn btn-ghost" type="submit">Subscribe</button>
      </form>
    </aside>
  </main>
  <div data-footer></div>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/contact.js"></script>
</body>
</html>
